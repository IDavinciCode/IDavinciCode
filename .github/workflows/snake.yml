# Author: Igor Davinci
# Version: 1.1.0
# The contribution calendar eaten by a snake, in the banner's colours.
# Platane/snk draws it; the two SVGs live on the `output` branch so the
# nightly redraw never touches main's history.
name: snake

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# a manual run and the nightly one must not race to push
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#78BECD&color_dots=#161b22,#173a42,#255f6b,#4c94a3,#78BECD&color_dot_border=#1c2a2e
            dist/snake-light.svg?color_snake=#1d6878&color_dots=#e6ebec,#c5e0e6,#8cc3cf,#4d98a8,#1d6878&color_dot_border=#c4d0d3
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
