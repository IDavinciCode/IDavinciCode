# Author: Igor Davinci
# Version: 1.3.0
# Redraws banner.svg every night from the repositories' metadata
# (name, language, last push). Commits only when the picture changed.
name: banner

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# a manual run and the nightly one must not race to push
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Draw
        env:
          GH_TOKEN: ${{ secrets.BANNER_TOKEN }}
        run: node scripts/make-banner.js
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add banner.svg banner-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(banner): redraw from repository metadata"
            git push
          fi
